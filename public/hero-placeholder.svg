<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Ilustración referencial de una línea de cocción industrial en acero inoxidable">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef0f2"/>
      <stop offset="100%" stop-color="#d6dade"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f5f6"/>
      <stop offset="45%" stop-color="#cfd4d8"/>
      <stop offset="55%" stop-color="#b8bec3"/>
      <stop offset="100%" stop-color="#dfe3e6"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9ecee"/>
      <stop offset="22%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#c2c8cd"/>
      <stop offset="72%" stop-color="#eef0f2"/>
      <stop offset="100%" stop-color="#b6bcc1"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cdd2d6"/>
      <stop offset="60%" stop-color="#eceef0"/>
      <stop offset="100%" stop-color="#aab0b6"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" fill="url(#wall)"/>

  <!-- Campana de extracción -->
  <path d="M150 60 H810 L770 150 H190 Z" fill="url(#hood)" stroke="#9aa1a7" stroke-width="2"/>
  <rect x="190" y="150" width="580" height="26" fill="#c3c9ce" stroke="#9aa1a7" stroke-width="2"/>
  <g stroke="#8f969c" stroke-width="2">
    <path d="M240 90 L228 140"/><path d="M300 90 L288 140"/><path d="M360 90 L348 140"/>
    <path d="M420 90 L408 140"/><path d="M480 90 L468 140"/><path d="M540 90 L528 140"/>
    <path d="M600 90 L588 140"/><path d="M660 90 L648 140"/><path d="M720 90 L708 140"/>
  </g>
  <rect x="440" y="20" width="80" height="42" fill="#b9bfc5" stroke="#9aa1a7" stroke-width="2"/>

  <!-- Repisa mural -->
  <rect x="210" y="212" width="540" height="10" fill="#cdd2d7" stroke="#a4abb1" stroke-width="1.5"/>
  <g fill="#bfc5ca">
    <rect x="250" y="188" width="46" height="24" rx="3"/>
    <rect x="316" y="192" width="34" height="20" rx="3"/>
    <rect x="600" y="186" width="60" height="26" rx="3"/>
  </g>

  <!-- Cubierta de trabajo -->
  <rect x="120" y="330" width="720" height="22" fill="url(#top)" stroke="#a4abb1" stroke-width="2"/>

  <!-- Quemadores -->
  <g stroke="#6f757a" stroke-width="3" fill="none">
    <circle cx="250" cy="318" r="26"/><circle cx="250" cy="318" r="12"/>
    <circle cx="340" cy="318" r="26"/><circle cx="340" cy="318" r="12"/>
    <circle cx="430" cy="318" r="26"/><circle cx="430" cy="318" r="12"/>
  </g>
  <!-- Plancha -->
  <rect x="500" y="292" width="200" height="52" rx="4" fill="#c8ced3" stroke="#8f969c" stroke-width="2"/>
  <g stroke="#aab0b6" stroke-width="2">
    <path d="M516 306 H684"/><path d="M516 318 H684"/><path d="M516 330 H684"/>
  </g>

  <!-- Cuerpo del mueble -->
  <rect x="120" y="352" width="720" height="170" fill="url(#panel)" stroke="#a4abb1" stroke-width="2"/>
  <g fill="none" stroke="#9aa1a7" stroke-width="2">
    <rect x="146" y="378" width="200" height="118" rx="3"/>
    <rect x="366" y="378" width="200" height="118" rx="3"/>
    <rect x="586" y="378" width="228" height="118" rx="3"/>
  </g>
  <g fill="#8f969c">
    <rect x="228" y="428" width="36" height="7" rx="3.5"/>
    <rect x="448" y="428" width="36" height="7" rx="3.5"/>
    <rect x="682" y="428" width="36" height="7" rx="3.5"/>
  </g>

  <!-- Perillas -->
  <g fill="#6f757a">
    <circle cx="180" cy="366" r="7"/><circle cx="212" cy="366" r="7"/><circle cx="244" cy="366" r="7"/>
  </g>

  <!-- Patas regulables -->
  <g fill="#9aa1a7">
    <rect x="146" y="522" width="16" height="42" rx="3"/>
    <rect x="798" y="522" width="16" height="42" rx="3"/>
  </g>
  <rect y="564" width="960" height="36" fill="#c6ccd1"/>

  <!-- Chispa TIG -->
  <g stroke="#c0392b" stroke-width="4" stroke-linecap="round">
    <path d="M760 250 L790 220"/>
    <path d="M790 220 L784 244"/>
    <path d="M790 220 L812 226"/>
  </g>
</svg>
