<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Marcador de posici&#243;n del hero: trama de plano t&#233;cnico pendiente de la fotograf&#237;a definitiva del taller">
  <defs>
    <pattern id="hero-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#2f3131" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Lienzo oscuro: soporta el velo rgba(95,94,94,0.55) y el texto blanco del hero.
       Ningun tono supera al gris de acero (#4b5563): por encima de el, el blanco
       del <h1> caeria por debajo de 4.5:1 una vez aplicado el velo.

       SIN UNA SOLA LETRA, a proposito. Antes este archivo traia un cartucho
       central con "JZ INOX", un "01" en rojo de 96 px y la leyenda
       "REEMPLAZAR POR FOTOGRAFIA DEL TALLER", justo en la banda donde vive el
       <h1>. El velo es semitransparente, asi que esa rotulacion se
       transparentaba por detras del titular y de los botones: no se leia como
       un hueco honesto, se leia como una pagina rota, en los primeros tres
       segundos de la visita. El rotulo del hueco pasa a ser un elemento del
       documento, anclado a una esquina (ver .hero__slot en index.astro), donde
       nunca puede cruzarse con el texto y no depende del recorte de
       object-fit: cover. Aqui solo queda la textura del plano. -->
  <rect width="1920" height="1080" fill="#1a1c1c"/>
  <rect width="1920" height="1080" fill="url(#hero-grid)"/>

  <!-- Aspa diagonal (marca de imagen ausente), al mismo valor que la trama -->
  <path d="M96 96 1824 984M1824 96 96 984" fill="none" stroke="#2f3131" stroke-width="1"/>

  <!-- Marco tecnico interior -->
  <rect x="96" y="96" width="1728" height="888" fill="none" stroke="#3a3f45" stroke-width="1"/>

  <!-- Marcas de esquina: la unica forma con algo de peso, y vive en los cantos,
       donde el degradado del velo deja la imagen casi limpia. -->
  <path d="M96 176V96h80M1744 96h80v80M1824 904v80h-80M176 984H96v-80"
        fill="none" stroke="#4b5563" stroke-width="3"/>
</svg>
